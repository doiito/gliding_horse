gateway:
  base_url: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  default_model: "deepseek-v4-flash"
  timeout_seconds: 300
  max_retries: 3
  retry_base_ms: 500
  # true: 所有模型走 Responses API (/v1/responses)；false: 走 Chat Completions
  # 模型是否支持 Responses 由所配置的 API 服务端决定，内核不硬编码模型名白名单。
  use_responses_api: true
  model_mapping:
    planning: "deepseek-v4-pro"
    execution: "deepseek-v4-flash"
    analysis: "deepseek-v4-flash"
    default: "deepseek-v4-flash"

workspace:
  root: ""
  watch_enabled: true
  content_store_max_bytes: 67108864
  content_cache_capacity: 1000
  poll_interval_ms: 5000
  debounce_ms: 500
  max_debounce_wait_ms: 5000
  initial_scan_wait_ms: 250
  change_history_capacity: 2048
  learning_snapshot_max_files: 100000
  learning_snapshot_max_bytes: 2147483648
  # Shell-like mutation calls are confirmed by bounded before/after content
  # fingerprints. Oversized workspaces degrade to monitor generation evidence.
  effect_snapshot_max_files: 10000
  effect_snapshot_max_bytes: 67108864
  exclude_patterns:
    - "node_modules/"
    - "target/"
    - ".git/"
    - "dist/"

# Generic continuous-learning promotion gate. These values govern bounded
# hint-ordering policy trials; they never bypass CA/AA quality decisions.
policy_learning:
  candidate_trial_min_baseline_samples: 1
  promotion_min_samples: 5
  # Require a measurable positive gain; equality is not an upward promotion.
  promotion_min_improvement: 0.01

# Family-scoped regression detector for promoted retrieval hint order. A
# degradation freezes only that learned treatment; any rollback needs approval.
learning_health:
  baseline_window: 12
  recent_window: 8
  min_samples_per_window: 5
  min_signal_strength: 1.96
  max_family_observations: 128

memory:
  l0:
    path: "/tmp/agent_os_data/l0"
    max_entries: 1000000
    compression: true
    blob_inline_threshold: 4096
    cache_size_bytes: 134217728
    quick_repair: true
  l1:
    max_messages: 100
    compression_threshold: 50
    max_tokens: 4096
    max_low_relevance_refs: 3
    reload_preview_chars: 400
  l2:
    max_node_size: 2048
    max_projection_size: 500
    sync_queue_capacity: 1024
  max_projection_size: 500
  sa_execution_timeout_secs: 30
  tool_timeout_secs: 60
  mcp_timeout_secs: 30
  embedding_timeout_secs: 30
  l3:
    default_frame: "summary_only"
    max_size: 500

perception:
  enabled: true
  triggers:
    - TaskStart
    - PlanCompleted
    - ProgressAnomaly
    - CheckCompleted
    - TaskEnd
  cache_ttl_seconds: 300
  cache_max_entries: 1000
  anomaly_dedup_window_seconds: 60
  simple_input_threshold: 50
  medium_input_threshold: 200
  cycle_timeout_secs: 300
  max_iterations_before_alert: 10
  error_rate_threshold: 0.5

agents:
  max_iterations: 100
  execution_budget:
    # Omitted/null role values inherit max_iterations. Avoid fixed small caps
    # for complex PA/CA/AA work; operators may set workload-specific ceilings.
    role_max_turns: {}
    early_warning_remaining: 8
    final_warning_remaining: 3
    effect_progress_warning_turns: 5
    # Consecutive tool-calling turns without a substantive workspace effect;
    # this is not the complex-task/DA total-turn limit.
    effect_progress_block_turns: 8
    # CA→DA repair begins from supplied audit evidence; 0 inherits the general threshold.
    da_repair_effect_block_turns: 4
    # 0 disables; complex audits may raise this without changing code.
    ca_evidence_focus_turns: 5
    # 0 disables; this caps CA evidence tool turns, not the task/DA turn budget.
    ca_evidence_close_turns: 10
    # 0 disables; bounds PA inspection without reducing DA execution budget.
    pa_planning_focus_turns: 4
    # Evidence-only DA: stop broad discovery, then force synthesis. These do
    # not cap implementation DA turns for workspace-changing complex tasks.
    da_evidence_focus_turns: 5
    da_evidence_close_turns: 8
    max_sub_agents: 5
    ca_handoff_max_chars: 6000
    recursive_handoff_max_chars: 4000
    sa_stream_emit_min_chars: 128
    sa_stream_emit_interval_ms: 50
    max_plan_steps: 12
    # Per decomposition node; does not multiply the task-wide limits below.
    max_recursive_sub_tasks: 5
    # Shared by the entire residual recursion tree. Raise explicitly for
    # unusually large tasks instead of allowing depth-based branch explosion.
    max_recursive_task_executions: 8
    max_recursive_total_turns: 60
    max_ca_da_corrections: 3
    max_plan_revisions: 2
    ca_correction_handoff_max_chars: 6000
    force_finish_max_tool_entries: 20
    force_finish_tool_result_max_chars: 2000
  parallel_execution: true
  max_parallel_agents: 10
  timeout_seconds: 300
  api_timeout_seconds: 120
  event_bus_capacity: 100
  max_active: 20
  snapshot_frequency: 1000
  max_full_snapshots: 10
  max_projection_size: 500

api:
  # Secure by default: use loopback listeners for direct access. To expose
  # either endpoint, put it behind a trusted TLS reverse proxy, set both
  # external_tls_terminated: true and a strong auth_token.
  grpc_addr: "127.0.0.1:50051"
  http_addr: "127.0.0.1:8080"
  enable_metrics: true
  metrics_port: 9090
  auth_token: null
  external_tls_terminated: false

output:
  directory: "/tmp/agent_os_data/output"

emphasis:
  enabled: true
  extraction_prompt: |
    ## 强调内容提取
    如果用户输入中包含强调性质的内容（如"必须"、"重要"、"不要忘记"、"关键"等），
    请将这些内容提取出来，放在 JSON 的 "emphasis" 字段中（字符串数组）。
    
    示例：
    {
      "thought": "用户强调了必须使用异步方式...",
      "content": "好的，我会...",
      "summary": "确认异步实现",
      "emphasis": ["必须使用异步方式实现"]
    }
  max_items: 50
  dedup_threshold: 0.85

logging:
  level: "info"
  format: "text"
  console_output: true
  file_output:
    enabled: false
    path: "/tmp/agent_os_logs"
    prefix: "agent_os"
    rotation: "daily"
    max_files: 30
  filters:
    - module: "agent_os::gateway"
      level: "debug"
    - module: "agent_os::core"
      level: "debug"
  sensitive_fields:
    - "api_key"
    - "password"
    - "token"
    - "secret"

tool_result_router:
  enabled: true
  threshold_small: 2048
  threshold_large: 8192
  micro_tool_threshold: 16384
  preview_size: 2000
  max_graph_entities: 500
  max_micro_tools: 5
  sparql_query_timeout_ms: 100
  auto_cleanup: true
  prepare_threshold: 3072
  micro_tool_page_size: 100
  micro_tool_max_page_size: 200

embedding:
  enabled: true
  provider: "ollama"
  ollama:
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"
    dimension: 768
  oneapi:
    base_url: ""
    api_key: ""
    model: "text-embedding-3-small"
    dimension: 1536
  fallback:
    dimension: 128

token_optimization:
  enabled: true
  tool_groups:
    enabled: true
    roles:
      Plan:
        default: ["Core", "Search", "System"]
        on_demand: ["Web", "Knowledge", "Code", "Skill"]
      Do:
        default: ["Core", "Write", "Search", "System"]
        on_demand: ["Web", "Knowledge", "Code", "Skill"]
      Check:
        default: ["Core", "Search", "Verify", "System"]
        on_demand: ["Web", "Knowledge", "Code"]
      Act:
        default: ["Core", "System"]
        on_demand: ["Search", "Knowledge"]
  tool_result_compressor:
    enabled: true
    max_full_results: 2
    max_summary_length: 200
    compression_trigger: 10
  context_window:
    max_messages: 15
    max_tokens: 16000
    compression_ratio: 0.3
    preserve_recent: 4
  prompt_optimization:
    enabled: true
    use_layered_prompts: true
    store_specs_in_kg: true
    max_injected_skills: 10
    max_workspace_manifest_files: 160
    max_workspace_manifest_chars: 12000
    max_kg_context_entities: 12
    max_kg_context_bytes: 4096
    max_learning_hints: 20
    max_learning_hint_chars: 700
    max_learning_hint_total_chars: 6000
    max_discovered_skill_hints: 10
    max_knowledge_fragments: 12
